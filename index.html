        }

            width: 100%;
            height: 100%;

            color: #2ecc71;

        }

            background-color: #bdc3c7;
            cursor: not-allowed;
        }

            margin-top: 15px;
            color: #7f8c8d;

        }

        }

    const levels = {
        facile: flashcardsFacile,
        moyen: flashcardsMoyen,
        difficile: flashcardsDifficile
    };
    let currentLevel = 'facile';
    let flashcards = levels[currentLevel];
    let currentIndex = 0;
    const cardEl = document.getElementById('card');

    function selectLevel(level) {
        currentLevel = level;
        flashcards = levels[level];
        currentIndex = 0;

        document.getElementById('btnFacile').classList.remove('active');
        document.getElementById('btnMoyen').classList.remove('active');
        document.getElementById('btnDifficile').classList.remove('active');
        document.getElementById('btn' + level.charAt(0).toUpperCase() + level.slice(1)).classList.add('active');

        cardEl.classList.remove('flipped');
        updateCard();
    }

    function updateCard() {
        cardEl.classList.remove('flipped');
        
        setTimeout(() => {
            document.getElementById('definition').innerText = flashcards[currentIndex].definition;
            document.getElementById('hint').innerText = flashcards[currentIndex].hint;
            document.getElementById('word').innerText = flashcards[currentIndex].word;
            document.getElementById('progress').innerText = `Carte ${currentIndex + 1} / ${flashcards.length}`;
            
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === flashcards.length - 1;
        }, 150); 
    }

    function flipCard() {
        cardEl.classList.toggle('flipped');
    }

    function nextCard() {
        if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            updateCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    updateCard();
</script>
