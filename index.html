        body {

            flex-direction: column;
            align-items: center;
            justify-content: center;

            margin: 0;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 90%;

        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 320px;
            margin: 20px 0;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-radius: 15px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            box-sizing: border-box;
        }

        .front {
            background-color: #ffffff;
            color: #333333;
            border: 2px solid #dcdde1;
        }

        .back {
            background-color: #34495e;
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .definition {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .hint {
            font-size: 0.95rem;
            color: #7f8c8d;
            font-style: italic;
            background-color: #f8f9fa;
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid #3498db;
        }

        .word {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #2ecc71;
            text-align: center;
        }

        .nav-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 0 10px;
        }

        .nav-btn:hover {
            background-color: #2980b9;
        }

        .nav-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .progress {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

    let currentIndex = 0;
    const cardEl = document.getElementById('card');

    function updateCard() {
        cardEl.classList.remove('flipped');
        
        setTimeout(() => {
            document.getElementById('definition').innerText = flashcards[currentIndex].definition;
            document.getElementById('hint').innerText = flashcards[currentIndex].hint;
            document.getElementById('word').innerText = flashcards[currentIndex].word;
            document.getElementById('progress').innerText = `Carte ${currentIndex + 1} / ${flashcards.length}`;
            
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === flashcards.length - 1;
        }, 150); 
    }

    function flipCard() {
        cardEl.classList.toggle('flipped');
    }

    function nextCard() {
        if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            updateCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    updateCard();
